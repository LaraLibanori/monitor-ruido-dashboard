name: Validar backend

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "templates/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "requirements*.txt"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "templates/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "requirements*.txt"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes (API + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noiseuser
          POSTGRES_PASSWORD: noisepass
          POSTGRES_DB: noisedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noiseuser -d noisedb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Compilar módulos Python
        run: python -m compileall -q .

      - name: Testes
        env:
          TEST_DATABASE_URL: postgresql://noiseuser:noisepass@localhost:5432/noisedb_test
        run: python -m pytest -q

  docker:
    name: Docker do zero + smoke test
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: chave-somente-para-o-ci
      SMOKE_ADMIN_PASSWORD: senha-somente-para-o-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuração Docker Compose
        run: docker compose config --quiet

      - name: Subir do zero (build + banco vazio)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Criar administrador
        run: >
          docker compose exec -T -e ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD" app
          python manage.py create-admin --name "Admin CI" --email admin-ci@exemplo.com

      - name: Smoke test das rotas
        run: python scripts/smoke_test.py http://localhost:5000 admin-ci@exemplo.com "$SMOKE_ADMIN_PASSWORD"

      - name: Reiniciar e conferir que os dados persistem
        run: |
          docker compose restart app
          docker compose up -d --wait --wait-timeout 120
          curl -fsS -X POST http://localhost:5000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin-ci@exemplo.com\",\"password\":\"$SMOKE_ADMIN_PASSWORD\"}" > /dev/null

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Derrubar
        if: always()
        run: docker compose down -v
