  <g stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M280 230H350"/><path d="M570 230H640"/>
    <path d="M860 210H930"/><path d="M860 240H930"/>
    <path d="M860 270C900 300 900 350 930 350"/>
