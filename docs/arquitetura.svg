  <g font-family="Arial" font-size="20" text-anchor="middle">
    <rect x="70" y="180" width="210" height="100" rx="18" fill="#123b55" stroke="#60a5fa" stroke-width="3"/>
    <text x="175" y="220" fill="#fff">ESP32 + INMP441</text><text x="175" y="252" fill="#b9d8f5">RMS a cada ~5 s</text>
    <rect x="360" y="180" width="210" height="100" rx="18" fill="#174936" stroke="#00e5a0" stroke-width="3"/>
