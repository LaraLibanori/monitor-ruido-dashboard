services:

  db:
    image: postgres:16-alpine
    container_name: noise_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noisedb}
      POSTGRES_USER: ${POSTGRES_USER:-noiseuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noisepass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Só a própria máquina acessa o banco (pgAdmin/DBeaver continuam funcionando)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noiseuser} -d ${POSTGRES_DB:-noisedb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: noise_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-noiseuser}:${POSTGRES_PASSWORD:-noisepass}@db:5432/${POSTGRES_DB:-noisedb}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1}
      # Lei do silêncio (padrão = convenção do Ed. Letícia)
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      SILENCE_START_WEEKDAY: ${SILENCE_START_WEEKDAY:-22:00}
      SILENCE_START_WEEKEND: ${SILENCE_START_WEEKEND:-15:00}
      SILENCE_END: ${SILENCE_END:-09:00}
      # App: sem leitura há mais que isso (segundos) = "sem sinal"
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-60}
      # Login e sessões (defina SECRET_KEY no .env para as sessões sobreviverem a reinícios)
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-72}
      APP_REQUIRE_AUTH: ${APP_REQUIRE_AUTH:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Ocorrências contínuas: gap, advertência e candidata a multa
      NOISE_CONTINUITY_GAP_SECONDS: ${NOISE_CONTINUITY_GAP_SECONDS:-15}
      NOISE_WARNING_SECONDS: ${NOISE_WARNING_SECONDS:-120}
      NOISE_FINE_SECONDS: ${NOISE_FINE_SECONDS:-300}
      # E-mail (vazio = modo simulado, nada é enviado)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Push: caminho DENTRO do container (a pasta ./secrets é montada em /run/secrets)
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
